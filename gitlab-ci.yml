stages:
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: "ayusht45cyber/image-search-app"
  IMAGE_TAG: "latest"
  DOCKER_TLS_CERTDIR: ""

# ESLint check
test_dependencies:
  stage: test
  image: node:16
  script:
    - echo "Creating basic ESLint config as it's missing..."
    - |
      cat > .eslintrc.js << 'EOF'
      module.exports = {
        env: {
          browser: true,
          es2021: true,
          node: true,
        },
        extends: [
          'eslint:recommended',
          'plugin:react/recommended',
        ],
        parserOptions: {
          ecmaFeatures: {
            jsx: true,
          },
          ecmaVersion: 'latest',
          sourceType: 'module',
        },
        plugins: [
          'react',
        ],
        rules: {
          // Relax some rules for now
          'react/prop-types': 'off',
          'react/react-in-jsx-scope': 'off',
        },
        settings: {
          react: {
            version: 'detect',
          },
        },
      };
      EOF
    - npm install
    - npm install --save-dev eslint eslint-plugin-react
    - npm run lint || true  # Don't fail the build for now

# Build and test the Docker image
build_job:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    # This ensures the environment variable is passed correctly
    VITE_API_KEY: ${VITE_API_KEY}
  script:
    - echo "Building the Docker image..."
    # Create a build-args file to pass sensitive variables
    - echo "VITE_API_KEY=${VITE_API_KEY}" > build-args.env
    # Build with args from file
    - docker build --build-arg VITE_API_KEY=${VITE_API_KEY} -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker save -o image.tar "$IMAGE_NAME:$IMAGE_TAG"
  artifacts:
    paths:
      - image.tar

# Deploy the image
deploy_job:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Logging into Docker Hub..."
    - echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USER" --password-stdin || exit 1
    - echo "Loading Docker image..."
    - docker load -i image.tar
    - echo "Pushing Docker image..."
    - docker push "$IMAGE_NAME:$IMAGE_TAG" || exit 1